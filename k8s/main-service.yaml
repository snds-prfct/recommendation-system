apiVersion: v1
kind: Service
metadata:
  labels:
    app: main-service
  name: main-service
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: main-service
  type: NodePort
status:
  loadBalancer: {}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: main-service
  name: main-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-service
  strategy: {}
  template:
    metadata:
      labels:
        app: main-service
    spec:
      containers:
        - image: snds_prfct/main-service:0.1
          name: main-service
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-broker:9092
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "200M"
            limits:
              cpu: "500m"
              memory: "500M"
