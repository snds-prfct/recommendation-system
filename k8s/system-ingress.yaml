apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: system-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: kafka-ui.recommendation-system.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080

    - host: grafana.recommendation-system.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

    - host: recommendation-system.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 8080
