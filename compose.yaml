services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    networks:
      - recommendation_system
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 600M
        reservations:
          cpus: '0.25'
          memory: 300M

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: kafka_ui
    ports:
      - "8083:8080"
    networks:
      - recommendation_system
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 250M

  main-service:
    image: snds_prfct/main-service:0.1
    build: main-service/
    container_name: main_service
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    networks:
      - recommendation_system
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 200M

  notification-service:
    image: snds_prfct/notification-service:0.1
    build: notification-service/
    container_name: notification_service
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    networks:
      - recommendation_system
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 200M

  recommendation-service:
    image: snds_prfct/recommendation-service:0.1
    build: recommendation-service/
    container_name: recommendation_service
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    networks:
      - recommendation_system
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 200M

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    networks:
      - recommendation_system
    depends_on:
      - recommendation-service
      - main-service
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 100M
        reservations:
          cpus: '0.10'
          memory: 20M

  grafana:
    image: grafana/grafana:12.3.2
    container_name: grafana
    volumes:
      - ./grafana/provisioning/datasources/:/etc/grafana/provisioning/datasource.yaml
    ports:
      - "3000:3000"
    networks:
      - recommendation_system
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 300M
        reservations:
          cpus: '1'
          memory: 100M

networks:
  recommendation_system:
    driver: bridge
