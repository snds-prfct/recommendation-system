global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'main_service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['main-service:8080']

  - job_name: 'recommendation_service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['recommendation-service:8080']

  - job_name: 'notification_service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'notification-service:8080' ]
